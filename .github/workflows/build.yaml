name: Build & Deploy

on:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - "CODE_OF_CONDUCT.md"
      - "README.md"
      - "SECURITY.md"
jobs:
  build-jdk21:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile with Maven
        run: mvn compile -ntp
  build-jdk25:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compile with Maven
        run: mvn compile -ntp

  check-versions:
    runs-on: ubuntu-26.04
    needs: [ build-jdk21, build-jdk25 ]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check versions with Maven
        run: mvn versions:display-dependency-updates -ntp

  test-jdk21:
    runs-on: ubuntu-26.04
    needs: [ build-jdk21 ]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test with Maven
        run: mvn test -ntp
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: surefire-report-jdk21
          path: "**/target/surefire-reports/"
  test-jdk25:
    runs-on: ubuntu-26.04
    needs: [ build-jdk25 ]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Test with Maven
        run: mvn test -ntp
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: surefire-report-jdk25
          path: "**/target/surefire-reports/"

  owasp:
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
      security-events: write
    needs: [ build-jdk21, build-jdk25 ]
    services:
      owasp-db:
        image: nalusolutionsgmbh/owasp-maven-action:latest
        options: --entrypoint /bin/sh --name owasp-db --hostname owasp-db
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Copy owasp database from container to runner
        run: docker cp $(docker ps -aqf "name=owasp-db"):/dependency-check/data ./dependency-checker-db/
      - name: OWASP Check
        run: |
          mvn org.owasp:dependency-check-maven:12.1.6:aggregate \
          -DdataDirectory=./dependency-checker-db \
          -DfailBuildOnCVSS=7 \
          -Dodc.outputDirectory=reports \
          -Dformat=HTML \
          -DautoUpdate=false \
          -DsuppressionFiles=./owasp/owasp-suppressions.xml
      - name: Upload OWASP results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: OWASP report
          path: ${{github.workspace}}/**/reports/dependency-check-report.html

  maven-deploy-dev:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
    needs: [ test-jdk21, test-jdk25, owasp ]
    if: github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Extract Maven project version
        run: echo "version=$(mvn -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec)" >> $GITHUB_OUTPUT
        id: project
      - name: Show extracted Maven project version
        run: echo ${{ steps.project.outputs.version }}
      - name: Check version
        if: ${{ !endsWith(steps.project.outputs.version, '-SNAPSHOT') }}
        uses: actions/github-script@v6
        with:
          script: |
            core.setFailed('Version not valid for dev')
      - id: install-secret-key
        name: Install GPG secret key
        run: |
          # Install gpg secret key
          cat <(echo -e "${{ secrets.OSSRH_GPG_KEY }}") | gpg --batch --import
          # Verify gpg secret key
          gpg --list-secret-keys --keyid-format LONG
      - name: Deploy with Maven
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: mvn deploy -ntp -Dgpg.passphrase=${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD_NALUKIT_GITHUB_USER }} -DskipTests -Drevision=HEAD-SNAPSHOT -P release
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_USER
          server-password: GITHUB_TOKEN
      - name: Deploy paniolo-cli to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # the other modules were installed into the local repository by the Maven Central deploy above
        run: mvn deploy -ntp -pl paniolo-cli -DskipTests -Drevision=HEAD-SNAPSHOT -Dgithub.packages.url=https://maven.pkg.github.com/${{ github.repository }}

  maven-deploy-main:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
    needs: [ test-jdk21, owasp ]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Extract Maven project version
        run: echo "version=$(mvn -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec)" >> $GITHUB_OUTPUT
        id: project
      - name: Show extracted Maven project version
        run: echo ${{ steps.project.outputs.version }}
      - name: Check version
        if: ${{ endsWith(steps.project.outputs.version, '-SNAPSHOT') }}
        uses: actions/github-script@v6
        with:
          script: |
            core.setFailed('Version not valid for main')
      - name: Check release consistency
        run: scripts/release/check-release.sh ${{ steps.project.outputs.version }}
      - name: Check if tag already exists
        id: version-check
        run: |
          echo $(git tag -l "${{ steps.project.outputs.version }}")
          if [ $(git tag -l "${{ steps.project.outputs.version }}") ]; then
            echo Version ${{ steps.project.outputs.version }} already exists!
            echo "already-exists=true" >> "$GITHUB_OUTPUT"
          else
            echo Version ${{ steps.project.outputs.version }} do not exists!
            echo "already-exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Test unique version
        run: |
          echo Version '${{ steps.project.outputs.version }}' already exists! Do not release!
          exit 1
        if: ${{ steps.version-check.outputs.already-exists == 'true' }}
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body: Release of version ${{ steps.project.outputs.version }}
          tag_name: ${{ steps.project.outputs.version }}
      - id: install-secret-key
        name: Install GPG secret key
        run: |
          # Install gpg secret key
          cat <(echo -e "${{ secrets.OSSRH_GPG_KEY }}") | gpg --batch --import
          # Verify gpg secret key
          gpg --list-secret-keys --keyid-format LONG
      - name: Deploy with Maven
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: mvn deploy -ntp -Dgpg.passphrase=${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD_NALUKIT_GITHUB_USER }} -DskipTests -Daether.checksums.algorithms=MD5 -Drevision=${{ steps.project.outputs.version }} -P release
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_USER
          server-password: GITHUB_TOKEN
      - name: Deploy paniolo-cli to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # the other modules were installed into the local repository by the Maven Central deploy above
        run: mvn deploy -ntp -pl paniolo-cli -DskipTests -Drevision=${{ steps.project.outputs.version }} -Dgithub.packages.url=https://maven.pkg.github.com/${{ github.repository }}

